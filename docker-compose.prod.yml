# Production stack: Postgres + Redis + the API server + BullMQ worker +
# Next.js web app, all behind Caddy for automatic HTTPS.
#
# `env_file: .env` values are injected verbatim — compose does NOT expand
# ${VAR} references written inside a .env file's own values, only inside
# this YAML. So DATABASE_URL/REDIS_URL/WEB_ORIGIN are deliberately set here
# via `environment:` (which does interpolate, and overrides env_file for the
# same key) rather than trusting whatever's in .env — that keeps the same
# .env.example usable for both plain `npm run dev` (localhost) and this
# Docker network (service names) without maintaining two files.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./packages/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      # Migrations run after the baseline on a FRESH volume. An existing
      # database is never touched by initdb — apply these with
      # `npm run db:migrate` instead (idempotent, safe to re-run).
      - ./packages/db/migrations:/docker-entrypoint-initdb.d/03-migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        # Set by scripts/deploy.sh. Unset builds are stamped
        # "unknown", which build-check reports as a failure rather
        # than passing quietly.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    # LOGS MUST OUTLIVE THE CONTAINER THAT WROTE THEM.
    #
    # Docker's default json-file driver stores logs under the container's own
    # directory, and `up -d --build` does not restart a container — it replaces
    # it. Every deploy therefore deletes the entire log history of the service
    # being deployed.
    #
    # That is worse here than almost anywhere, because this platform's whole
    # method for finding its failures is reading logs after the fact: the
    # Gemini 404, the BullMQ colon, the empty-rota mute, the judge returning
    # "medium" because it could not be reached — every one was found by going
    # back and looking. On 2026-08-17 an unexplained inbound message could not
    # be diagnosed at all, because eight deploys that day had erased the two
    # days of worker logs that would have said what happened.
    #
    # journald keeps them on the host, survives container replacement, and is
    # already persistent on this box (/var/log/journal). `docker compose logs`
    # still works — journald is one of the drivers Docker can read back — so
    # nothing about the existing workflow changes, and journald's own
    # SystemMaxUse cap keeps it from filling the disk the way an unbounded
    # json-file can.
    logging:
      driver: journald
      options:
        tag: "nexus-{{.Name}}"
    env_file: .env
    environment:
      NODE_ENV: production
      # Set to 1 when the owner has decided backups stay on this machine.
      # Off by default, so a NEW deployment is still told about it.
      BACKUP_OFFSITE_WAIVED: ${BACKUP_OFFSITE_WAIVED:-0}
      # Least-privilege role (migration 006). Falls back to the owner role when
      # APP_DB_* is unset so an existing deployment keeps working, but a
      # production deploy should set both — the app needs DML only, and running
      # it as the superuser owner makes row-level security unenforceable.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      # Comma-separated CORS allowlist. The same web build is served from BOTH
      # app.<domain> and the bare <domain> (see Caddyfile), so both must be
      # allowed — listing only one makes the other silently render an empty UI.
      WEB_ORIGIN: https://${WEB_DOMAIN},https://${ROOT_DOMAIN}
      # Must match the web service: the API authenticates browser traffic by
      # verifying the same operator session the web app signs.
      NEXUS_SESSION_SECRET: ${NEXUS_SESSION_SECRET:-nexus-dev-secret-change-me}
      NEXUS_API_TOKEN: ${NEXUS_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        # Set by scripts/deploy.sh. Unset builds are stamped
        # "unknown", which build-check reports as a failure rather
        # than passing quietly.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ["npx", "tsx", "apps/api/src/worker.ts"]
    restart: unless-stopped
    # NINETY SECONDS, AND THE DEFAULT WAS TEN.
    #
    # worker.ts closes every BullMQ worker on SIGTERM, and close() waits for the
    # job in flight to finish. Docker then gives it ten seconds before SIGKILL,
    # and the platform's own numbers say that is not enough: across the replies
    # measured on 2026-08-24 the AVERAGE took 10.2 seconds and the slowest took
    # 27.0 -- a model call, a retrieval and a send to Meta, end to end.
    #
    # So a deploy landing while somebody is being answered killed the job
    # mid-flight. That is worse than it sounds, because the retry does not fix
    # it: the inbound message is already recorded, so recordInboundMessage
    # returns a null id, the processor correctly reads that as a webhook replay
    # and returns -- and the reply that was interrupted is never sent. The
    # customer gets silence, the job completes green, and only the
    # customer-waiting operator notices, two hours later.
    #
    # Ninety gives the slowest observed reply better than three times its
    # measured worst case. It does not cover a hard crash or an OOM kill, which
    # drop the message the same way; that needs the retry to ask "has a reply
    # gone out" rather than "have I seen this message", and it is a change to
    # the reply path rather than a line of compose.
    stop_grace_period: 90s
    # Same as api, and this is the one that matters most: the reply pipeline,
    # the operators and every scheduled job log here. See the note above.
    logging:
      driver: journald
      options:
        tag: "nexus-{{.Name}}"
    env_file: .env
    environment:
      NODE_ENV: production
      # Set to 1 when the owner has decided backups stay on this machine.
      # Off by default, so a NEW deployment is still told about it.
      BACKUP_OFFSITE_WAIVED: ${BACKUP_OFFSITE_WAIVED:-0}
      # Least-privilege role (migration 006). Falls back to the owner role when
      # APP_DB_* is unset so an existing deployment keeps working, but a
      # production deploy should set both — the app needs DML only, and running
      # it as the superuser owner makes row-level security unenforceable.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Set by scripts/deploy.sh. Unset builds are stamped
        # "unknown", which build-check reports as a failure rather
        # than passing quietly.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${API_DOMAIN}/ws
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Set to 1 when the owner has decided backups stay on this machine.
      # Off by default, so a NEW deployment is still told about it.
      BACKUP_OFFSITE_WAIVED: ${BACKUP_OFFSITE_WAIVED:-0}
      # Command-deck operator login (/login → /deck). Set these in .env for prod;
      # the defaults keep the demo working out of the box.
      NEXUS_OPERATOR_PASSWORD: ${NEXUS_OPERATOR_PASSWORD:-demo1234}
      NEXUS_SESSION_SECRET: ${NEXUS_SESSION_SECRET:-nexus-dev-secret-change-me}
      # Parent domain, so the session cookie is also sent to api.<domain>.
      # Leading dot form (".example.com") is the portable spelling.
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nexus-caddy-data:/data
      - nexus-caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  nexus-postgres-data:
  nexus-caddy-data:
  nexus-caddy-config:
