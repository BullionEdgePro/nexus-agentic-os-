<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16140F">
<title>Offline · Nexus</title>
<style>
  /* Cream and Warm Night (1 Nov 2026), as in the console. */
  :root { color-scheme: light dark; --ground: #F3EFE8; --ink: #16140F; --soft: #5B5549; --signal: #16140F; --on-signal: #F3EFE8; }
  @media (prefers-color-scheme: dark) { :root { --ground: #14120E; --ink: #F3EFE8; --soft: #C9C1B3; --signal: #F3EFE8; --on-signal: #14120E; } }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }
  main { max-width: 34ch; text-align: center; display: grid; gap: 14px; justify-items: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: var(--soft); }
  button {
    margin-top: 6px; font: inherit; font-weight: 600; color: var(--on-signal); background: var(--signal);
    border: 0; border-radius: 999px; padding: 12px 22px; min-height: 44px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>No connection</h1>
  <p>You're offline. Nexus will reconnect when you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
